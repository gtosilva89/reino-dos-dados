<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reino dos Dados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: HUD de RPG no topo, mapa em pixel art à esquerda, diário de viagem à direita; cenas em janela de diálogo estilo console 16-bit */
:root{
  --noite:#14112a; --painel:#221c40; --borda:#f2e9d8; --texto:#f2e9d8; --suave:#b8b0d6;
  --ouro:#ffcf4a; --vida:#ff5d73; --ok:#7ae582; --mana:#5ec8ff; --sombra:#0a0818;
  --f-tit:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --f-txt:'VT323', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
.cena.largo{width:min(1280px,100%)}.ph{font-family:var(--f-tit);font-size:11px;color:var(--ouro);margin:6px 0 0}.tag{display:inline-block;padding:1px 8px;color:#fff}.mini{font-size:16px;padding:2px 8px}.tb.calor td,.tb.calor th{font-size:15px;padding:2px 5px}
button.som[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
html,body{height:100%}
body{background:var(--noite);color:var(--texto);font-family:var(--f-txt);font-size:22px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;}
*{box-sizing:border-box}
button{font-family:var(--f-txt);font-size:22px;color:var(--noite);background:var(--ouro);border:0;padding:8px 14px;cursor:pointer;
  box-shadow:0 4px 0 #b8860b, 0 0 0 3px var(--sombra);}
button:hover{filter:brightness(1.08)} button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b,0 0 0 3px var(--sombra)}
button:focus-visible,input:focus-visible{outline:3px dashed var(--mana);outline-offset:3px}
button.sec{background:var(--suave);box-shadow:0 4px 0 #6f6894,0 0 0 3px var(--sombra)}
button:disabled{opacity:.45;cursor:not-allowed}
.px{border:3px solid var(--borda);box-shadow:0 0 0 3px var(--sombra),6px 6px 0 3px var(--sombra);background:var(--painel)}
h1,h2,h3{font-family:var(--f-tit);font-weight:400;text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 14px}
.hud h1{font-size:14px;color:var(--ouro);letter-spacing:1px}
.stat{display:flex;gap:8px;align-items:center;min-width:0}
.stat b{font-family:var(--f-tit);font-size:10px;color:var(--suave);font-weight:400}
.hearts{letter-spacing:2px;color:var(--vida);font-size:26px}
.xpbar{width:150px;height:14px;background:var(--sombra);border:2px solid var(--borda);position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--mana);width:0}
.selos{display:flex;gap:6px;flex-wrap:wrap}
.selo{font-family:var(--f-tit);font-size:9px;background:var(--ouro);color:var(--noite);padding:4px 6px}
.hud .spacer{flex:1}
/* área principal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.mapa{position:relative;aspect-ratio:320/184;max-width:100%;padding:0}
.mapa canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.lbl{position:absolute;transform:translate(-50%,0);font-size:17px;padding:1px 6px;background:rgba(10,8,24,.82);color:var(--texto);
  white-space:nowrap;pointer-events:none;border:2px solid transparent}
.lbl.disp{border-color:var(--ouro);color:var(--ouro)} .lbl.feito{color:var(--ok)} .lbl.trava{color:#8a84a8}
@media (max-width:620px){.lbl{font-size:13px;padding:0 3px}}
.diario{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.diario h2{font-size:11px;color:var(--ouro);margin-bottom:4px}
.lugar{display:flex;justify-content:space-between;gap:8px;align-items:center;background:transparent;color:var(--texto);box-shadow:none;padding:4px 6px;text-align:left;border:2px solid #3b3366;font-size:20px}
.lugar:hover{border-color:var(--ouro)} .lugar small{font-size:16px;color:var(--suave)}
.lugar.feito small{color:var(--ok)} .lugar.disp small{color:var(--ouro)}
.lugar:disabled{opacity:.5}
.dica{font-size:18px;color:var(--suave)}
/* cena */
.veu{position:fixed;inset:0;background:rgba(10,8,24,.78);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.cena{width:min(820px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.cena h2{font-size:14px;color:var(--ouro);line-height:1.5}
.npc{display:flex;gap:14px;align-items:flex-start}
.npc canvas{width:96px;height:96px;image-rendering:pixelated;flex:none;border:3px solid var(--borda);background:#2d2655}
.fala{font-size:24px;min-width:0}
.fala .quem{font-family:var(--f-tit);font-size:10px;color:var(--mana);display:block;margin-bottom:6px}
.acoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.perg{border:3px dashed #e8d9a8;background:#f6ecd0;color:#3a2a14;padding:14px 16px;font-size:22px;line-height:1.2}
.perg h3{font-size:12px;color:#7a3d14;margin-bottom:10px;line-height:1.6}
.perg p{margin:0 0 8px} .perg .ex{background:#ead9a8;padding:8px;border-left:6px solid #b5442e}
.arena{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.arena{grid-template-columns:minmax(0,1fr)}}
.arena canvas{width:120px;height:120px;image-rendering:pixelated;justify-self:center}
.hpb{height:14px;background:var(--sombra);border:2px solid var(--borda);position:relative;margin-top:6px}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--vida);transition:width .3s}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ops{grid-template-columns:minmax(0,1fr)}}
.ops button{background:var(--painel);color:var(--texto);box-shadow:0 0 0 3px var(--borda);text-align:left;font-size:21px;padding:10px 12px}
.ops button:hover{background:#2f2758}
.ops button.certo{background:#1f5f3a;box-shadow:0 0 0 3px var(--ok)} .ops button.errado{background:#6b1f2c;box-shadow:0 0 0 3px var(--vida)}
.fb{font-size:21px;padding:8px 10px;border-left:6px solid var(--mana);background:#1a1533}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--vida)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--painel);color:var(--texto);box-shadow:0 0 0 3px #6f6894;font-size:21px}
.chip[aria-pressed="true"]{background:var(--mana);color:var(--noite);box-shadow:0 0 0 3px var(--borda)}
.regras{display:grid;gap:4px;font-size:20px}
.regras div{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;background:#1a1533;padding:4px 8px}
.regras b{color:var(--ouro);font-family:var(--f-tit);font-size:9px;padding-top:5px}
.linha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:560px){.linha{grid-template-columns:minmax(0,1fr)}}
select,input{font-family:var(--f-txt);font-size:22px;background:var(--sombra);color:var(--texto);border:3px solid var(--borda);padding:6px 8px;max-width:100%}
.tit-inicio{font-size:clamp(18px,4vw,34px);color:var(--ouro);line-height:1.4;text-shadow:4px 4px 0 var(--sombra)}
.avs{display:flex;gap:12px;flex-wrap:wrap}
.avs button{background:#2d2655;box-shadow:0 0 0 3px #6f6894;padding:6px}
.avs button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ouro);background:#3b3366}
.avs canvas{width:64px;height:80px;image-rendering:pixelated;display:block}
.ficha table{width:100%;border-collapse:collapse;font-size:20px}
.ficha td,.ficha th{border-bottom:2px solid #3b3366;padding:4px 6px;text-align:left}
.ficha th{font-family:var(--f-tit);font-size:9px;color:var(--suave);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;font-family:var(--f-tit);font-size:11px;background:var(--ouro);color:var(--noite);padding:10px 14px;box-shadow:0 0 0 3px var(--sombra)}
.tremer{animation:tre .35s}
@keyframes tre{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.tremer{animation:none}.hpb i{transition:none}}
.hud .dif{font-family:var(--f-tit);font-size:10px;background:var(--mana);color:var(--noite);padding:4px 6px}
.lbl.regiao{font-family:var(--f-tit);font-size:10px;padding:4px 6px;border-color:var(--borda)}
.lbl.regiao.trava{color:#8a84a8;border-color:#3b3366}
.reg{font-family:var(--f-tit);font-size:9px;color:var(--mana);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;line-height:1.5}
.reg.trava{color:#8a84a8}
.mini{font-size:16px;padding:2px 8px;box-shadow:0 2px 0 #b8860b,0 0 0 2px var(--sombra)}
.arte{width:100%;max-width:480px;aspect-ratio:96/54;image-rendering:pixelated;align-self:center;border:3px solid var(--borda)}
.tbw{overflow-x:auto;max-width:100%}
.tb{border-collapse:collapse;font-size:20px;min-width:100%}
.tb th,.tb td{border:2px solid #3b3366;padding:3px 8px;text-align:left;white-space:nowrap}
.tb th{background:#004f8b;color:#fff;font-weight:400}
.cod{background:#0a0818;color:#80ed99;border:2px solid #3b3366;padding:10px 12px;margin:0;font-family:ui-monospace,'Courier New',monospace;font-size:15px;line-height:1.35;overflow-x:auto;white-space:pre}
.nvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.nvs{grid-template-columns:minmax(0,1fr)}}
.nv{border:3px solid var(--borda);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#1a1533;min-width:0}
.nv.facil{border-color:var(--ok)} .nv.medio{border-color:var(--ouro)} .nv.dificil{border-color:var(--mana)} .nv.expert{border-color:#c77dff}
.nv.trava{opacity:.8;border-style:dashed}
.nvtop{display:flex;justify-content:space-between;gap:8px}
.nvn{font-family:var(--f-tit);font-size:12px;color:var(--ouro)}
.nvt{font-size:24px}
.fh{font-size:10px;color:var(--mana);margin:8px 0 4px;line-height:1.5}
summary{cursor:pointer;color:var(--suave)}
</style>
</head><body>
<div class="wrap">
  <header class="hud px" aria-label="Status do aventureiro">
    <h1>REINO DOS DADOS</h1>
    <span class="dif" id="hDif">—</span>
    <div class="stat"><b>HERÓI</b><span id="hNome">—</span></div>
    <div class="stat"><b>VIDA</b><span class="hearts" id="hVida" aria-live="polite"></span></div>
    <div class="stat"><b>NÍVEL</b><span id="hNivel">—</span></div>
    <div class="stat"><b>XP</b><div class="xpbar" aria-hidden="true"><i id="hXpBar"></i></div><span class="num" id="hXp">0</span></div>
    <div class="selos" id="hSelos"></div>
    <div class="spacer"></div>
    <button class="sec" id="btnVisao" type="button" aria-pressed="false">Mapa completo</button>
    <button class="sec" id="btnNiveis" type="button">Níveis</button>
    <button class="sec" id="btnFicha" type="button">Ficha</button>
    <button class="sec som" id="btnFx" type="button" aria-pressed="true">Efeitos: sim</button>
    <button class="sec som" id="btnMus" type="button" aria-pressed="true">Música: sim</button>
  </header>
  <div class="main">
    <div class="mapa px" id="mapa"><canvas id="cv" width="320" height="184" aria-label="Mapa do nível"></canvas></div>
    <aside class="diario px" aria-label="Diário de viagem">
      <h2 id="dTit">DIÁRIO DE VIAGEM</h2>
      <div class="dica">Clique num lugar brilhando no mapa (ou aqui na lista) para viajar.</div>
      <div id="lista" style="display:flex;flex-direction:column;gap:6px"></div>
    </aside>
  </div>
</div>
<div class="veu" id="veu" hidden><div class="cena px" id="cena" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
const CARDS = [
 {t:'Por que o programa esquece?', p:[
  'Na UC1 vocês guardavam os dados em variáveis, vetores e matrizes. Tudo isso mora na memória RAM: é rápida, mas é apagada quando o programa fecha ou o computador desliga.',
  'Persistência é a capacidade de os dados continuarem existindo depois que o programa termina. Para isso, eles precisam ir para um armazenamento permanente (disco).',
  'Dado é o registro bruto: "Ana", "45,00", "16/11". Informação é o dado organizado que ajuda a decidir: "Ana gastou R$ 45,00 na barbearia hoje".',
  'Dá para salvar em arquivo (.txt, .csv), mas com muitos dados, vários usuários ao mesmo tempo e regras a cumprir, o arquivo vira bagunça: duplicados, um salva por cima do outro, ninguém sabe quem mudou o quê.',
  'Banco de dados é um conjunto organizado de dados relacionados, guardado de forma permanente.'],
  ex:'O atendente cadastra 30 clientes no programa em Python, a luz acaba... e o cadastro some. Com banco de dados, ao religar, os 30 continuam lá.'},
 {t:'SGBD: o gerente dos dados', p:[
  'SGBD = Sistema Gerenciador de Banco de Dados. É o programa que cuida do banco: guarda, busca, altera e protege os dados.',
  'Ele armazena de forma permanente, responde consultas, controla quem pode ver e mudar cada coisa (usuários e permissões), deixa várias pessoas usarem ao mesmo tempo e faz cópias de segurança (backup).',
  'Arquitetura cliente-servidor: o seu programa (cliente) pede; o SGBD (servidor) confere as regras e executa; o banco guarda os dados em tabelas.',
  'Exemplos de SGBD: PostgreSQL, MySQL, SQL Server, Oracle, SQLite.',
  'A conversa com o SGBD é em SQL. DDL cria a estrutura (ex.: criar tabela). DML mexe nos dados (inserir, alterar, apagar, consultar).'],
  ex:'O app da barbearia (cliente) pede "agendamentos de hoje". O PostgreSQL (servidor) busca na tabela agendamento e devolve só o que o atendente pode ver.'},
 {t:'Tabela, registro, campo e tipo', p:[
  'No banco relacional os dados ficam em tabelas, parecidas com as matrizes da UC1: linhas e colunas.',
  'Cada tabela guarda um tipo de coisa: cliente, servico, agendamento (substantivo no singular).',
  'Campo (coluna) é uma característica: nome, telefone, preço. Registro (linha) é um item completo: a cliente Ana, com telefone e nascimento.',
  'Cada campo tem um tipo: VARCHAR (texto), INTEGER (inteiro), NUMERIC (com casas decimais), DATE (data), TIME (hora), BOOLEAN (verdadeiro/falso).',
  'Dicionário de dados descreve cada campo: nome, tipo, tamanho, se é obrigatório, se é chave e para que serve. É o manual do banco.'],
  ex:'Tabela servico: id (INTEGER), nome (VARCHAR 40), preco (NUMERIC 6,2), duracao_min (INTEGER). Registro: 1 | Corte | 35,00 | 30.'},
 {t:'Chaves: quem é quem', p:[
  'Chave primária (PK) identifica cada registro de forma única. Não repete e não fica vazia. Normalmente é um código: id.',
  'Nome não serve como chave: existem duas "Ana Souza". Telefone também muda. Um id nunca repete e nunca muda.',
  'Chave estrangeira (FK) é um campo que guarda a PK de OUTRA tabela. É assim que as tabelas se ligam.',
  'A tabela agendamento tem cliente_id, que aponta para o id da tabela cliente. Assim o banco sabe de quem é cada agendamento sem repetir nome e telefone.',
  'O SGBD protege a ligação: não deixa criar agendamento para cliente que não existe (integridade referencial). UNIQUE impede repetição em outro campo (ex.: telefone).'],
  ex:'cliente: id=7, nome=Ana.  agendamento: id=120, cliente_id=7, 16/11, 19:00.  O 7 é a FK que leva até a Ana.'},
 {t:'MER: o desenho antes do banco', p:[
  'Antes de criar o banco, a gente desenha. Modelagem de dados é planejar o banco a partir das regras de negócio.',
  'O MER tem três peças. Entidade: algo sobre o qual guardamos dados (Cliente) → vira tabela. Atributo: característica (nome) → vira campo. Relacionamento: como as entidades se ligam (Cliente FAZ Agendamento).',
  'Cardinalidade: 1:1 (uma pessoa, um CPF), 1:N (um cliente, vários agendamentos), N:N (um aluno em várias turmas e uma turma com vários alunos).',
  'Dica: substantivos com dados próprios viram entidades; características viram atributos; verbos que ligam duas entidades viram relacionamentos.',
  'Um N:N não cabe direto em duas tabelas: vira uma terceira tabela no meio (tabela associativa), com as duas FKs.'],
  ex:'"Um cliente pode marcar vários agendamentos; cada agendamento é de um só cliente."  →  CLIENTE 1 ──── N AGENDAMENTO'},
 {t:'Da planilha ao banco de dados', p:[
  'Uma planilha (Excel) já resolve o "esquecer": o arquivo fica salvo no disco. Isso é persistência.',
  'Mas uma tabela só, com tudo misturado, cria problemas: repetição (a mesma cliente em várias linhas), inconsistência ("Ana Souza" e "ana souza"), vários valores numa célula ("Corte, Barba") e formatos errados (valor escrito como texto).',
  'Organizando a planilha como um banco: cada ABA vira uma tabela; cada LINHA, um registro; cada COLUNA, um campo. Um ID que nunca repete é a chave primária. Guardar o ID de outra aba é a chave estrangeira, e o PROCV faz o papel do JOIN. A validação de dados faz o papel das restrições.',
  'Os limites do Excel: ele deixa apagar um cliente que tem agendamentos (#N/D), aceita dois clientes no mesmo horário, não controla várias pessoas editando ao mesmo tempo, não tem usuários e permissões de verdade e fica lento com milhões de linhas.',
  'Por isso a gente MIGRA: a estrutura pensada na planilha (abas, IDs, tipos) vira o projeto do banco, e o SGBD passa a garantir as regras.'],
  ex:'A aba Clientes (ID, Nome, Telefone) vira a tabela cliente (id PK, nome, telefone UNIQUE). A aba Agendamentos guarda ID_Cliente: no banco, cliente_id é uma FK.'}
];
const Q = {
 vila:[
  {q:'Onde ficam as variáveis enquanto o programa está rodando?', o:['Na memória RAM','No disco, para sempre','Dentro do banco de dados','No GitHub'], c:0, e:'Variáveis moram na RAM. Fechou o programa, elas somem.'},
  {q:'O que é persistência?', o:['Os dados continuarem existindo depois que o programa fecha','Rodar o programa até dar certo','Salvar o código no GitHub','Um tipo de variável do Python'], c:0, e:'Persistir = sobreviver ao fim do programa.'},
  {q:'Qual destas é uma INFORMAÇÃO, e não só um dado?', o:['"Ana gastou R$ 45,00 hoje na barbearia"','"45,00"','"Ana"','"16/11"'], c:0, e:'Informação é o dado organizado, com sentido para decidir.'},
  {q:'Três atendentes salvam no mesmo arquivo .txt ao mesmo tempo. Qual o risco?', o:['Um salvar por cima do que o outro salvou','O .txt não aceitar letras','O arquivo só abrir no Windows','Nenhum risco'], c:0, e:'Sem um gerente (SGBD), as gravações se atropelam.'}],
 planilha:[
  {q:'O Seu Jair passou a agenda para o Excel. O problema do "esquecer" foi resolvido?', o:['Sim: o arquivo fica salvo no disco (persistência)','Não: o Excel também apaga tudo ao fechar','Só se ele imprimir a planilha','Só se usar fórmulas'], c:0, e:'Planilha salva em disco já é persistência. Os problemas são outros.'},
  {q:'"Ana Souza" aparece em 3 linhas, sempre com o mesmo telefone. Que problema é esse?', o:['Repetição (redundância)','Persistência','Chave primária','Backup'], c:0, e:'Dado repetido = redundância: se o telefone mudar, é preciso corrigir em várias linhas.'},
  {q:'A célula "Serviços" tem "Corte, Barba". Por que isso atrapalha?', o:['Dois valores numa célula: não dá para contar quantos cortes foram feitos','Porque a vírgula apaga a célula','Porque o Excel não aceita texto','Não atrapalha em nada'], c:0, e:'Cada célula (campo) deve ter um valor só: dado atômico.'},

function somSalvar(){try{localStorage.setItem('reinoDosDados_som',JSON.stringify({fx:SOM.fx,mus:SOM.mus}))}catch(e){}}
function audio(){if(!SOM.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{SOM.ctx=new C()}catch(e){return null}
  SOM.master=SOM.ctx.createGain();SOM.master.gain.value=.6;SOM.master.connect(SOM.ctx.destination);SOM.musG=SOM.ctx.createGain();SOM.musG.gain.value=.35;SOM.musG.connect(SOM.master)}
 if(SOM.ctx.state==='suspended')SOM.ctx.resume();return SOM.ctx}
const hz=n=>440*Math.pow(2,(n-69)/12);
function tom(f,dur,tipo,vol,quando,dest){const c=audio();if(!c)return;const t=Math.max(c.currentTime,quando||c.currentTime);const o=c.createOscillator(),g=c.createGain();
 o.type=tipo||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||.12,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest||SOM.master);o.start(t);o.stop(t+dur+.03)}
function seq(notas,passo,tipo,vol,dur){const c=audio();if(!c)return;const t0=c.currentTime+.01;notas.forEach((n,i)=>{if(n)tom(hz(n),dur||passo*1.6,tipo,vol,t0+i*passo)})}

function agendar(){const c=SOM.ctx;if(!c||!SOM.faixa)return;const[mel,bx,dt]=FAIXAS[SOM.faixa];
 while(SOM.prox<c.currentTime+.15){const i=SOM.passo%mel.length;if(mel[i])tom(hz(mel[i]),dt*1.5,'square',.05,SOM.prox,SOM.musG);
  if(i%8===0)tom(hz(bx[(i/8)|0]),dt*3,'triangle',.12,SOM.prox,SOM.musG);if(i%8===4)tom(hz(bx[(i/8)|0]+7),dt*2,'triangle',.08,SOM.prox,SOM.musG);

  SOM.passo++;SOM.prox+=dt}}

// Google do professor (Apps Script em planilha/Codigo.gs). Sem internet, fica pendente e é refeito sozinho.
const NUVEM_URL='https://script.google.com/macros/s/AKfycbzHLqdUSzL48g-_kLPpT4iLXsN1dqD-dqoYtDcwumfRp14MTxM2TYvMcUagvW9wfG-GtQ/exec';
const ENV_KEY='reinoDosDados_enviado';
const normNome=n=>String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function envLer(){try{return JSON.parse(localStorage.getItem(ENV_KEY)||'{}')}catch(e){return{}}}
function envGravar(o){try{localStorage.setItem(ENV_KEY,JSON.stringify(o))}catch(e){}}
function contarNivel(lv,p){let t=0,f=0;lv.fases.forEach(fa=>Object.entries(fa.lugares).forEach(([id,l])=>{if(l.extra||l.tipo==='portao')return;t++;if(p&&p.feito&&p.feito[id])f++}));return{t,f}}
function progressoTxt(x){return LEVELS.filter(lv=>x.P&&x.P[lv.id]).map(lv=>{const c=contarNivel(lv,x.P[lv.id]);return lv.nome+' '+c.f+'/'+c.t}).join(' • ')}
let nuvemTimer=null,nuvemEstado='',nuvemQuando=0,nuvemOcupada=false;
function nuvemPendente(x){if(!x||!x.nome||!x.ts)return false;const e=envLer();return !(e.nome===normNome(x.nome)&&e.ts===x.ts)}
async function nuvemEnviar(x){if(!NUVEM_URL||!x||!x.nome)return false;
 try{await fetch(NUVEM_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify({nome:x.nome,data:new Date(x.ts||Date.now()).toLocaleString('pt-BR'),ts:x.ts||0,xp:x.xp||0,nivel:nivel(x.xp||0)[1],progresso:progressoTxt(x),S:x})});
  envGravar({nome:normNome(x.nome),ts:x.ts||0});nuvemEstado='ok';nuvemQuando=Date.now();return true}
 catch(err){nuvemEstado='falhou';return false}}
function nuvemAgendar(){if(!NUVEM_URL||!S||!S.nome)return;nuvemEstado='pendente';clearTimeout(nuvemTimer);nuvemTimer=setTimeout(()=>nuvemEnviar(JSON.parse(JSON.stringify(S))),4000)}
async function nuvemPendentes(){if(!NUVEM_URL||nuvemOcupada)return;nuvemOcupada=true;try{const x=carregar();if(nuvemPendente(x))await nuvemEnviar(x)}finally{nuvemOcupada=false}}
function nuvemStatusTxt(){if(!NUVEM_URL)return'';if(nuvemEstado==='ok')return'✔ Progresso enviado ao professor às '+new Date(nuvemQuando).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.';
 if(nuvemEstado==='falhou')return'Sem internet agora: o envio ao professor será refeito sozinho.';if(nuvemEstado==='pendente')return'Enviando o progresso ao professor…';return S&&!nuvemPendente(S)?'✔ Progresso já enviado ao professor.':''}
async function nuvemAluno(nome){if(!NUVEM_URL)return{erro:'O professor ainda não ligou a planilha.'};
 try{const r=await fetch(NUVEM_URL+'?aluno='+encodeURIComponent(nome)+'&t='+Date.now());const d=await r.json();if(!d.ok||!d.item||!d.item.S)return{erro:'Não achei esse nome na planilha. Digite igual ao dia em que jogou.'};return{S:d.item.S}}
 catch(err){return{erro:'Sem conexão com a planilha agora.'}}}
async function nuvemBaixar(chave){if(!NUVEM_URL)return{erro:'Planilha não configurada.'};
 try{const r=await fetch(NUVEM_URL+'?chave='+encodeURIComponent(chave)+'&t='+Date.now());const d=await r.json();if(!d.ok)return{erro:d.erro==='senha'?'A planilha recusou a senha.':'Erro na planilha.'};
  return{lista:(d.lista||[]).filter(x=>x&&x.nome&&x.S)}}catch(err){return{erro:'Sem conexão com a planilha.'}}}
if(NUVEM_URL){setTimeout(nuvemPendentes,2000);setInterval(nuvemPendentes,60000)}

 for(const i in lugaresInd){const L=lugaresInd[i];if(!L.length){out.sug[i]='—';continue}const fe=L.filter(z=>z.feito).length,bons=L.filter(z=>z.bom).length;out.sug[i]=fe===L.length&&bons/L.length>=0.7?'A':fe/L.length>=0.5?'PA':'NA'}
 out.atencao=out.atencao.filter(z=>z.feito||z.er>0).sort((a,b)=>b.er-a.er).slice(0,4);return out}
function baixarArq(nome,conteudo,tipo){const b=new Blob([conteudo],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function alunosProf(){const m=new Map();for(const it of profLista||[])m.set(normNome(it.nome),{...it.S,nome:it.nome,_data:it.data,_ts:it.ts||0});
 const loc=carregar();if(loc&&loc.nome&&!m.has(normNome(loc.nome)))m.set(normNome(loc.nome),{...loc,_data:'só neste PC',_ts:loc.ts||0});
 return[...m.values()].sort((a,b)=>a.nome.localeCompare(b.nome))}
function csvProf(AL){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const cab=['Aluno','Salvo em','XP','Nível',...LEVELS.map(l=>l.nome),...[1,2,3,4,5,6].map(i=>'Ind '+i),'Atenção',...BAT.map(b=>'Erros '+b.lvn+' '+b.nome)];
 const rows=AL.map(x=>{const a=analisar(x);return[x.nome,x._data||'',x.xp||0,nivel(x.xp||0)[1],...LEVELS.map(l=>a.niveis[l.id]?a.niveis[l.id].f+'/'+a.niveis[l.id].t:''),...[1,2,3,4,5,6].map(i=>a.sug[i]),a.atencao.map(z=>z.nome).join('; '),
  ...BAT.map(b=>{const p=(x.P||{})[b.lv];if(!p)return'';return p.feito[b.id]?((p.erros||{})[b.id]||0):'não fez'})]});
 baixarArq('reino-dos-dados_turma.csv','﻿'+[cab,...rows].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv')}
function areaProfessor(){if(profAberto)return painelProf();
 const inp=el('input',{id:'senhaProf',type:'password',autocomplete:'off','aria-label':'Senha do professor',placeholder:'Senha'});const fb=el('div',{class:'fb no',hidden:''});
 const ok=()=>{if(senhaOk(inp.value)){profAberto=true;senhaProf=inp.value;sfx('porta');painelProf(true)}else{sfx('erro');fb.hidden=false;fb.textContent='Senha errada.';inp.value='';inp.classList.add('tremer');setTimeout(()=>inp.classList.remove('tremer'),400)}};
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok()});
 cena(el('h2',{},'Área do Professor 🔒'),el('div',{class:'fala'},'Digite a senha do professor:'),inp,fb,el('div',{class:'acoes'},el('button',{class:'sec',type:'button',on:{click:()=>{fechar();inicio()}}},'Voltar'),el('button',{type:'button',on:{click:ok}},'Entrar')))}
const corSug={A:'#1b7f3b',PA:'#b7791f',NA:'#c53030','—':'#555'};
function painelProf(buscar){const AL=alunosProf();const saida=el('div',{});
 const nst=el('div',{class:'dica',id:'nuvemStatus'},NUVEM_URL?(profMsg||'Clique em Atualizar da planilha para buscar os salvamentos.'):'Planilha do professor não configurada: aparece só quem jogou neste computador.');
 const atualizar=()=>{nst.textContent='Buscando os salvamentos na planilha…';nuvemBaixar(senhaProf).then(r=>{if(r.erro){profMsg=r.erro;nst.textContent=r.erro;return}
  profLista=r.lista;try{localStorage.setItem(PROF_KEY,JSON.stringify(profLista))}catch(e){}profMsg=`Planilha: ${r.lista.length} aluno(s), atualizado às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`;painelProf()})};
 if(buscar&&NUVEM_URL)setTimeout(atualizar,50);
 if(AL.length){
  const linhas=AL.map(x=>{const a=analisar(x);return `<tr><td>${escH(x.nome)}</td><td>${escH(x._data||'')}</td><td class="num">${x.xp||0}</td><td>${escH(nivel(x.xp||0)[1])}</td>${LEVELS.map(l=>`<td>${a.niveis[l.id]?a.niveis[l.id].f+'/'+a.niveis[l.id].t:'—'}</td>`).join('')}${[1,2,3,4,5,6].map(i=>`<td><span class="tag" style="background:${corSug[a.sug[i]]}">${a.sug[i]}</span></td>`).join('')}<td>${a.atencao.map(z=>escH(z.nome)).join(', ')||'—'}</td></tr>`}).join('');
  const cel=(t,c)=>`<td style="background:${c};text-align:center">${t}</td>`;
  const calor=AL.map(x=>`<tr><td>${escH(x.nome)}</td>${BAT.map(b=>{const p=(x.P||{})[b.lv];if(!p)return cel('','#1a1533');const e=(p.erros||{})[b.id]||0,f=p.feito&&p.feito[b.id];return cel(f?(e>=4?'4+':e):(e?e:'·'),!f?'#3d3550':e===0?'#2d6a4f':e<=1?'#55a630':e<=3?'#e09f3e':'#9e2a2b')}).join('')}</tr>`).join('');
  const soma=BAT.map(b=>AL.reduce((t,x)=>t+((((x.P||{})[b.lv]||{}).erros||{})[b.id]||0),0));
  const top=BAT.map((b,i)=>[b,soma[i]]).filter(z=>z[1]>0).sort((p,q)=>q[1]-p[1]).slice(0,6);
  saida.innerHTML=`<h3 class="ph">TURMA (${AL.length} alunos)</h3><div class="tbw"><table class="tb"><tr><th>Aluno</th><th>Salvo em</th><th>XP</th><th>Nível</th>${LEVELS.map(l=>`<th>${escH(l.nome)}</th>`).join('')}${[1,2,3,4,5,6].map(i=>`<th title="${escH(IND_TXT[i])}">Ind. ${i}</th>`).join('')}<th>Atenção</th></tr>${linhas}</table></div>
  <div class="dica">Ind. 1 a 6 = sugestão A / PA / NA a partir do jogo (só dos níveis que o aluno começou; — = ainda não começou). A menção é sua: confirme com a observação em sala.</div>
  <h3 class="ph">BATALHAS QUE MAIS DERRUBARAM A TURMA</h3>${top.length?'<ol>'+top.map(([b,n])=>`<li>${escH(b.lvn)} • ${escH(b.nome)}: ${n} erro(s) somados</li>`).join('')+'</ol>':'<p class="dica">Nenhum erro registrado.</p>'}
  <h3 class="ph">MAPA DE CALOR (erros por batalha)</h3><div class="dica">Verde = 0 ou 1 erro; laranja = 2 ou 3; vermelho = 4 ou mais; · = não concluída; escuro = nível não começado.</div>
  <div class="tbw"><table class="tb calor"><tr><th>Aluno</th>${BAT.map(b=>`<th title="${escH(b.lvn)}">${escH(b.nome)}</th>`).join('')}</tr>${calor}</table></div>`}
 else saida.append(el('div',{class:'fala'},'Ainda não há salvamentos. Peça para os alunos jogarem: o progresso chega sozinho na planilha.'));
 const barra=el('div',{class:'acoes',style:'justify-content:flex-start;flex-wrap:wrap'},NUVEM_URL?el('button',{type:'button',on:{click:atualizar}},'Atualizar da planilha ⟳'):null,
  AL.length?el('button',{class:'sec',type:'button',on:{click:()=>csvProf(AL)}},'Baixar planilha (CSV)'):null);
 cena(el('h2',{},'Área do Professor • progresso da turma'),
  el('h3',{class:'ph'},'CÓDIGOS DO MESTRE (não mostrar aos alunos)'),
  el('div',{class:'tbw'},el('table',{class:'tb'},el('tr',{},el('th',{},'Código'),el('th',{},'Onde')),
   ...[['NAVALHA','Fácil • Portão do Mestre (Região 3)'],['DRAGAO','Fácil • Castelo do Dragão N:N (chefão)'],['MODELO','Tela Níveis • libera o Médio'],['HIDRA','Médio • Lago da Hidra (chefão)'],['CREATE','Tela Níveis • libera o Difícil'],['WHERE','Difícil • Covil do Golem (chefão)'],['PYTHON','Tela Níveis • libera o Expert'],['APAGAO','Expert • Covil do Dragão do Apagão (chefão)']].map(([c,o])=>el('tr',{},el('td',{},el('b',{},c)),el('td',{},o))))),
  nst,barra,saida,el('div',{class:'acoes'},el('button',{class:'sec',type:'button',on:{click:()=>{profAberto=false;fechar();inicio()}}},'Sair da área (trancar)')));
 $('cena').classList.add('largo')}
</script></body></html>
